[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hdems"
version = "0.1.0"
description = "Hyperdimensional Event Motion Segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["hdems*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
