# EV-IMO motion segmentation config

d: 512                   # 1024 OOMs a 32GB V100 at 480x640; measured flow is identical
#                          for d = 64..1024 on EVIMO2, so this costs no accuracy

flow_cache:              # the frozen cost volume is ~80% of a training step: compute
  enabled: true          # its flow once per sample and reuse it every epoch / run.
  dir: cache/flow        # ~1.2 MB per frame (~5 GB for train+eval). Keyed on the kernel
  #                        weights + M/alpha/smooth + the surface itself, so changing
  #                        any of them recomputes automatically. Safe to delete anytime.

# Values below follow the VSA-Flow paper, Table A1 (DSEC column). Pixel-sized
# values (patch_size, M, smooth) are FULL-resolution; dataset.resolution_ratio
# divides them automatically.
encoder:
  patch_size: 21          # paper N — HD kernel aperture
  sigma_k: 1.5            # paper σ_K — Gaussian G in K = D ∗ G
  kernel: conv            # conv = paper Eq.6 (K = D ∗ G); window = old Gaussian window
  polarity_binding: true  # paper Eq.7-8: per-polarity kernels, role-bound  (old: summed)
  scales: 2               # paper S (Eq.9 multi-scale descriptor)           (old: 1)

matching:
  M: 31                   # paper M — cost-volume search window (±15 px). Was 7 (±3 px):
  #                         real motion on the moving-camera train scenes is 5-9 px, so
  #                         M=7 could not represent it and the flow was noise there
  pyramid_levels: 4
  scales: [0, 1, 2]       # paper two-time cost volume: F0 vs F1/F2/F4 at pool 1/2/4
  alpha: 0.85             # paper α — Eq.12 probability-volume threshold   (was 0.3)
  smooth: 71              # paper sc — Eq.12 cost-volume average pooling   (was 3)
  vel_scale: 1.0          # displacement->velocity scale (1.0 = pixel units)

dataset:
  name: evimo
  root: ../Data/EVIMO2_new/samsung_mono/imo   # EVENT camera (Samsung DVS, 640x480)
  split: train
  eval_split: eval
  height: 480            # full sensor resolution
  width: 640
  resolution_ratio: 1    # 1 = full, 2 = half (240x320), 4 = quarter (120x160).
  #                        Also divides patch_size / M / smooth, so they keep covering
  #                        the same physical area; the cost volume gets ~ratio^4 cheaper.
  #                        Override per run with --resolution-ratio.
  window_ms: 50.0
  time_frames: [0.0, 0.25, 0.5, 1.0]   # paper multi-time surfaces (F0,F1,F2,F4); [] = single-time
  label_mode: motion     # motion  = MOVING vs rest, from the pose metadata (Option A, 2 classes)
  #                        tracked = legacy mask>0 ("on a tracked surface" — includes the
  #                                  static table, so NOT motion; baseline/ablation only)
  #                        objects = per-object id (Option B; ids 5..28 -> needs >=29)
  scene_disjoint: true   # drop train sequences whose scene also appears in eval/
  #                        (train/ and eval/ hold different takes of scene13/14/15)
  require_mover: true    # train only on frames where >=1 object is moving ...
  negative_ratio: 0.1    # ... plus this share of all-static frames as negatives
  interleave: true       # round-robin across sequences so --max-train-samples N
  #                        is a balanced sample, not the first sequence only

motion_label:            # label_mode: motion — thresholds in IMAGE PIXELS per window
  move_px: 1.0           # >= this displacement -> moving
  static_px: 0.3         # <= this -> static; in between -> ignore (255)
  boundary_ignore_px: 2  # ignore a band this wide around every mask boundary
  rot_radius_m: 0.05     # nominal object radius, so spin-in-place counts as motion
  min_moving_px: 100     # a frame "has a mover" only if that object is visible
  #                        in the mask with at least this many pixels

grouping:                # ONE COLOUR PER MOVING OBJECT (eval + event-colour figures)
  enabled: true          # the CNN's moving pixels are grouped by the motion model they fit
  #                        (affine flow per object, sequential RANSAC + merge of neighbours),
  #                        so a whole object gets one colour even if its flow direction varies.
  #                        Distances below are FULL-resolution; resolution_ratio scales them.
  tol_px: 0.7            # a pixel belongs to a motion model within this flow error (px/interval)
  min_object_px: 160     # smaller groups are not objects
  max_objects: 8
  merge_tol_px: 0.7      # neighbouring groups whose joint motion fits within this are one object
  adjacency_px: 6        # groups this close count as neighbours
  ransac_iters: 300

train:
  task: segmentation
  batch_size: 1
  epochs: 30             # upper bound; early stopping usually ends much sooner
  patience: 5            # stop after this many validations without improvement (0 = off)
  val_every: 2           # validate every N epochs (always on the last epoch)
  lr: 1.0e-4
  num_workers: 8
  use_dice: true          # add Dice to CE (background/foreground imbalance)
  # max_samples: 100      # optional: train on first N frames (or CLI --max-samples)

eval:
  metrics: [iou, miou]
  split: eval
  # max_samples: 20       # optional: eval on first N frames (or CLI --max-samples)

velocity:
  vel_bw: 6.0            # FPE bandwidth for residual velocity (topological similarity)
  event_feature: phi     # event HV fused with velocity -> phi (7x7 bundled field) | f (descriptor F0)
  axis_combine: bind     # combine Vx,Vy -> bind | bundle
  event_combine: bind    # combine event HV X with velocity code Mv ->
  #                        bind (X o Mv) | bundle (X + Mv) | bindbundle ((X^ o Mv) + Mv) | concat

segmentation:
  head: cnn             # cnn (HV-channels CNN, trained) | prototype | ridge | motion
  #                      cnn/motion -> hdems.train ; ridge/prototype -> fit_ridge_head.py
  num_classes: 32        # used by label_mode=objects/remap; motion forces 2
  embedding_dim: 32
  ctx_dim: 32            # motion head: compressed HV context channels
  flow_beta: 1.0         # motion head: soft-argmax temperature for Phi->velocity
  ego_iters: 3           # motion head: IRLS passes for global-motion fit
  mean_center: false     # CNN legacy checkpoints (no centering)
  motion_features: false
  ridge_mean_center: true
  ridge_motion_features: true
  ridge_weights: checkpoints/ridge_head.pt
  prototype_weights: checkpoints/prototype_head.pt

ridge:
  backend: streaming     # streaming | sklearn
  imbalance: balanced    # balanced | subsample_bg | none
  bg_subsample_ratio: 0.2
  val_split: eval
  alphas: [1.0e-3, 1.0e-1, 1.0, 10.0, 100.0]
  # max_train_samples: 50   # optional smoke cap (first N frames)
  # max_val_samples: 10

time_surface:
  tau_ms: 35.0           # paper τ_TS (Eq.3): event weight exp(-age / 35 ms).
  #                        The old `decay: 0.8` was per SECOND, i.e. 0.989 across 50 ms:
  #                        effectively no decay, so each surface smeared 50 ms of motion.
