# EV-IMO motion segmentation config

d: 512

encoder:
  patch_size: 21
  sigma_k: 1.5
  rank: 16
  separable_terms: 2

matching:
  M: 7
  pyramid_levels: 4
  scales: [0, 1, 2]       # paper two-time cost volume: F0 vs F1/F2/F4 at pool 1/2/4
  alpha: 0.3              # Eq.12 probability-volume threshold coefficient
  vel_scale: 1.0          # displacement->velocity scale (1.0 = pixel units)

dataset:
  name: evimo
  root: ../Data/EVIMO2
  split: train
  eval_split: eval
  height: 240
  width: 320
  window_ms: 50.0
  time_frames: [0.0, 0.25, 0.5, 1.0]   # paper multi-time surfaces (F0,F1,F2,F4); [] = single-time
  remap_mask: true
  use_classical_fallback: true

train:
  task: segmentation
  batch_size: 1
  epochs: 30
  lr: 1.0e-4
  num_workers: 8
  use_dice: true          # add Dice to CE (background/foreground imbalance)
  # max_samples: 100      # optional: train on first N frames (or CLI --max-samples)

eval:
  metrics: [iou, miou]
  split: eval
  # max_samples: 20       # optional: eval on first N frames (or CLI --max-samples)

segmentation:
  head: ridge           # ridge | motion | cnn  (with time_frames set -> paper front-end)
  num_classes: 32
  embedding_dim: 32
  ctx_dim: 32            # motion head: compressed HV context channels
  flow_beta: 1.0         # motion head: soft-argmax temperature for Phi->velocity
  ego_iters: 3           # motion head: IRLS passes for global-motion fit
  mean_center: false     # CNN legacy checkpoints (no centering)
  motion_features: false
  ridge_mean_center: true
  ridge_motion_features: true
  ridge_weights: checkpoints/ridge_head.pt

ridge:
  backend: streaming     # streaming | sklearn
  imbalance: balanced    # balanced | subsample_bg | none
  bg_subsample_ratio: 0.2
  val_split: eval
  alphas: [1.0e-3, 1.0e-1, 1.0, 10.0, 100.0]
  # max_train_samples: 50   # optional smoke cap (first N frames)
  # max_val_samples: 10

time_surface:
  decay: 0.8
