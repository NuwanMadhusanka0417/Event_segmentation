# EV-IMO motion segmentation config

d: 512

encoder:
  patch_size: 21
  sigma_k: 1.5
  rank: 16
  separable_terms: 2

matching:
  M: 7
  pyramid_levels: 4

dataset:
  name: evimo
  root: ../Data/EVIMO2
  split: train
  eval_split: eval
  height: 240
  width: 320
  window_ms: 50.0
  remap_mask: true
  use_classical_fallback: true

train:
  task: segmentation
  batch_size: 1
  epochs: 30
  lr: 1.0e-4
  num_workers: 8

eval:
  metrics: [iou, miou]
  split: eval

segmentation:
  num_classes: 32
  embedding_dim: 32

time_surface:
  decay: 0.8
